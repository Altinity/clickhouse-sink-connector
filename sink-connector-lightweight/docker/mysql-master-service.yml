version: "3.4"

services:
  mysql-master:
    container_name: mysql-master
    image: mysql:8.0
    restart: "no"
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=test
      - TZ=US/Central
    volumes:
      - ./mysqld.cnf:/etc/mysql/conf.d/my_custom.cnf
      - ../sql/init_mysql.sql:/docker-entrypoint-initdb.d/init_mysql.sql
    healthcheck:
      test: [ 'CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uroot', '-proot' ]
      interval: 15s
      timeout: 5s
      retries: 6
