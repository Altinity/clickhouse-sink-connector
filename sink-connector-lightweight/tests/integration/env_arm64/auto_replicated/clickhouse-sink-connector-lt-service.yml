version: "2.3"

services:
    clickhouse-sink-connector-lt:
      hostname: clickhouse-sink-connector-lt
      image: altinityinfra/clickhouse-sink-connector:893-93e02aee863adaed823eeff023364781b438f669-lt
      restart: "no"
      expose:
        - "8083"
        - "1976"
        - "5005"
      extra_hosts:
        - "host.docker.internal:host-gateway"
      entrypoint: bash -c "tail -f /dev/null"
      volumes:
        - ./configs:/configs
        - ../../logs:/logs
        - ./configs/logs/log4j2.xml:/log4j2.xml