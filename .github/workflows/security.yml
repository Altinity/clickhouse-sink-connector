name: Security Scan

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main, develop]
  schedule:
    - cron: "0 8 * * 1" # weekly Monday 08:00 UTC

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL (Java SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java
          queries: +security-extended

      - name: Build with Maven
        run: mvn -B compile -DskipTests -pl sink-connector,sink-connector-lightweight

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java"

  dependency-check:
    name: OWASP Dependency-Check (Maven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run OWASP Dependency-Check via Maven
        run: >-
          mvn -B org.owasp:dependency-check-maven:check
          -DfailBuildOnCVSS=9
          -Dformats=SARIF
          -DsuppressionFile=.github/dependency-check-suppressions.xml
          -DnvdApiDelay=6000
          -pl sink-connector,sink-connector-lightweight
          -am

      - name: Find and upload SARIF reports
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: .
          category: dependency-check

  trivy:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy (table output for logs)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: "1"
          format: table
          trivy-config: trivy.yaml

      - name: Run Trivy (SARIF for GitHub Security tab)
        uses: aquasecurity/trivy-action@master
        if: always()
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: "0"
          format: sarif
          output: trivy-results.sarif
          trivy-config: trivy.yaml

      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif
