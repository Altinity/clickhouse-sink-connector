name: Publish Release

on: 
  workflow_call:
    inputs: 
      release_tag:
        required: true
        type: string
      prerelease:
        required: true
        type: boolean
        default: true
      draft:
        required: true
        type: boolean
        default: false
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false
  workflow_dispatch:
    inputs: 
      release_tag:
        required: true
        type: string
      prerelease:
        required: true
        type: boolean
        default: true
      draft:
        required: true
        type: boolean
        default: false

env:
  release_tag: ${{ inputs.release_tag }}

jobs:
  publish-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull test images
        if: ${{ !inputs.prerelease && !inputs.draft}}
        run: |
          docker pull altinityinfra/clickhouse-sink-connector:$release_tag-test-kafka

      - name: Tag and push Kafka image
        if: ${{ !inputs.prerelease && !inputs.draft}}
        run: |
          docker image tag altinityinfra/clickhouse-sink-connector:$release_tag-test-kafka altinity/clickhouse-sink-connector:$release_tag-kafka
          docker push altinity/clickhouse-sink-connector:$release_tag-kafka

      - name: Tag and push Lightweight multi-arch image (ARM64 + AMD64)
        if: ${{ !inputs.prerelease && !inputs.draft }}
        run: |
          docker buildx imagetools create \
            --tag altinity/clickhouse-sink-connector:$release_tag-lt \
            altinityinfra/clickhouse-sink-connector:$release_tag-test-lt

      - name: Update Docker links
        working-directory: release-notes
        if: ${{ !inputs.prerelease && !inputs.draft}}
        run: sed -i "s/release_tag/$release_tag/" ${{ env.release_tag }}.md

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.release_tag }}
          release_name: Release v${{ env.release_tag }}
          prerelease: ${{ inputs.prerelease }}
          draft: ${{ inputs.draft }}
          body_path: ${{ github.workspace }}/release-notes/${{ env.release_tag }}.md

      #- name: Download Kafka jar artifact
      #  uses: actions/download-artifact@v4
      #  with:
      #    name: clickhouse-sink-connector-kafka-${{ env.release_tag }}-test.jar
      #    path: ./artifacts/kafka

      - name: Download Lightweight jar artifact
        uses: actions/download-artifact@v4
        with:
          name: clickhouse-sink-connector-lt-${{ env.release_tag }}-test.jar
          path: ./artifacts/lightweight

      - name: List downloaded artifacts
        run: |
          #echo "Kafka artifacts:"
          #ls -la ./artifacts/kafka/
          echo "Lightweight artifacts:"
          ls -la ./artifacts/lightweight/

      #- name: Find and rename Kafka jar
      #  run: |
      #    KAFKA_JAR=$(find ./artifacts/kafka -name "clickhouse-kafka-sink-connector-*.jar" -type f | head -n 1)
      #    echo "Found Kafka jar: $KAFKA_JAR"
      #    cp "$KAFKA_JAR" ./clickhouse-sink-connector-kafka-${{ env.release_tag }}.jar

      - name: Find and rename Lightweight jar
        run: |
          LT_JAR=$(find ./artifacts/lightweight -name "clickhouse-debezium-embedded-*.jar" -type f | head -n 1)
          echo "Found Lightweight jar: $LT_JAR"
          cp "$LT_JAR" ./clickhouse-sink-connector-lt-${{ env.release_tag }}.jar

      #- name: Upload jar file to release (Kafka)
      #  uses: actions/upload-release-asset@v1
      #  env:
      #    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #  with:
      #    upload_url: ${{ steps.create_release.outputs.upload_url }}
      #    asset_name: clickhouse-sink-connector-kafka-${{ env.release_tag }}.jar
      #    asset_path: ./clickhouse-sink-connector-kafka-${{ env.release_tag }}.jar
      #    asset_content_type: application/java-archive

      - name: Upload jar file to release (Lightweight)
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_name: clickhouse-sink-connector-lt-${{ env.release_tag }}.jar
          asset_path: ./clickhouse-sink-connector-lt-${{ env.release_tag }}.jar
          asset_content_type: application/java-archive

      - name: Zip and tar source code
        run: |
          cd ..
          zip -r Source.zip clickhouse-sink-connector
          tar czf Source.tar.gz clickhouse-sink-connector

      - name: Upload source zip
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_name: Source.zip
          asset_path: ../Source.zip
          asset_content_type: application/zip

      - name: Upload source tar
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_name: Source.tar.gz
          asset_path: ../Source.tar.gz
          asset_content_type: application/gzip
