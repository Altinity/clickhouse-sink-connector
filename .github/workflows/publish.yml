name: Publish Release

on: 
  workflow_call:
    inputs: 
      release_tag:
        required: true
        type: string
      prerelease:
        required: true
        type: boolean
        default: true
      draft:
        required: true
        type: boolean
        default: false
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false

env:
  release_tag: ${{ inputs.release_tag }}
  # Must match IMAGE_TAG passed to docker-build.yml from release.yml (${{ inputs.release_tag }}-test).
  build_image_tag: ${{ inputs.release_tag }}-test

jobs:
  publish-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and push Lightweight multi-arch image (ARM64 + AMD64)
        if: ${{ !inputs.prerelease && !inputs.draft }}
        run: |
          docker buildx imagetools create \
            --tag altinity/clickhouse-sink-connector:$release_tag-lt \
            altinityinfra/clickhouse-sink-connector:$release_tag-test-lt

      - name: Update Docker links
        working-directory: release-notes
        if: ${{ !inputs.prerelease && !inputs.draft}}
        run: sed -i "s/release_tag/$release_tag/" ${{ env.release_tag }}.md

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.release_tag }}
          release_name: Release v${{ env.release_tag }}
          prerelease: ${{ inputs.prerelease }}
          draft: ${{ inputs.draft }}
          body_path: ${{ github.workspace }}/release-notes/${{ env.release_tag }}.md

      - name: Download Lightweight jar artifact
        uses: actions/download-artifact@v4
        with:
          name: clickhouse-sink-connector-lt-${{ env.build_image_tag }}.jar
          path: ./artifacts/lightweight

      - name: Download sink-connector-client (AMD64)
        uses: actions/download-artifact@v4
        with:
          name: clickhouse-sink-connector-client-${{ env.build_image_tag }}.bin
          path: clickhouse-sink-connector-client-${{ env.build_image_tag }}.bin

      - name: Download sink-connector-client (ARM64)
        uses: actions/download-artifact@v4
        with:
          name: clickhouse-sink-connector-client-${{ env.build_image_tag }}-arm64.bin
          path: clickhouse-sink-connector-client-${{ env.build_image_tag }}-arm64.bin

      - name: Upload sink-connector-client binary to release (ARM64)
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_name: clickhouse-sink-connector-client-${{ env.release_tag }}-arm64
          asset_path: clickhouse-sink-connector-client-${{ env.build_image_tag }}-arm64.bin/sink-connector-client-arm64
          asset_content_type: application/octet-stream

      - name: Upload sink-connector-client binary to release (AMD64)
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_name: clickhouse-sink-connector-client-${{ env.release_tag }}-amd64
          asset_path: clickhouse-sink-connector-client-${{ env.build_image_tag }}.bin/sink-connector-client-amd64
          asset_content_type: application/octet-stream

      - name: Zip Lightweight jar
        working-directory: ./artifacts/lightweight
        run: zip "clickhouse-sink-connector-lt-${{ env.release_tag }}.jar.zip" *.jar

      - name: Upload Lightweight jar to release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_name: clickhouse-sink-connector-lt-${{ env.release_tag }}.jar.zip
          asset_path: ./artifacts/lightweight/clickhouse-sink-connector-lt-${{ env.release_tag }}.jar.zip
          asset_content_type: application/zip

      - name: Zip and tar source code
        run: |
          cd ..
          zip -r Source.zip clickhouse-sink-connector
          tar czf Source.tar.gz clickhouse-sink-connector

      - name: Upload source zip
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_name: Source.zip
          asset_path: ../Source.zip
          asset_content_type: application/zip

      - name: Upload source tar
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_name: Source.tar.gz
          asset_path: ../Source.tar.gz
          asset_content_type: application/gzip
