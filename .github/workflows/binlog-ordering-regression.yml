name: Binlog ordering regression

on:
  pull_request:
  push:
    branches:
      - '2.11.1'

permissions:
  contents: read

concurrency:
  group: binlog-ordering-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  binlog-ordering:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run cursor, version, schema, binary and durability regressions
        run: >-
          mvn --batch-mode -pl sink-connector-lightweight -am
          -Dtest=SourcePositionTest,BinlogOffsetVersionTest,CounterCarryResetInversionTest,EngineEpochVersionTest,InRunRedeliveryVersionTest,TerminalFailureExitTest,StopPoolTerminationTest,EngineRestartFifoResetTest,StoppedEngineRetiresHandoffsTest,SchemaCacheFailureModesTest,ClickHouseDataTypeMapperBitBytesTest,ClickHouseDataTypeMapperPoisonValueTest,MissingTargetTableEngineTest
          -DfailIfNoTests=true -Dsurefire.failIfNoSpecifiedTests=false test
