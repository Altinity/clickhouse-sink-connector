name: Review Gates

# Deterministic review gates over the lines a pull request adds (Spec 11.06,
# doc/review_gates.md): destructive operations must be warned and attested,
# no code may stop ClickHouse merges, no GPL/LGPL/AGPL dependency may reach a
# runtime scope, and basic hygiene (conflict markers, swallowed exceptions,
# leaked credentials, YAML/JSON that no longer parses).

on:
  pull_request:
    branches:
      - '**'

permissions:
  contents: read

concurrency:
  group: review-gates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review-gates:
    name: Review gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the PR head (full history for the base...head diff)
        uses: actions/checkout@v4
        with:
          # The synthetic merge commit's message never carries the contributor's
          # Destructive-Op-Check trailer; gate the PR's own commits.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML (YAML syntax check)
        run: python3 -m pip install --quiet pyyaml

      # The checks come from the BASE branch, not from the PR head: a branch
      # cut before the checks existed has no copy of them (scripts/tests is
      # then not even a directory), and a PR must not be able to weaken the
      # checks that judge it. A PR that changes the checks themselves still
      # runs its own copy's tests in the spec-governance job.
      #
      # One exception, the release pull request. A release line is a branch of
      # this repository named like a version (2.11.1). When it already contains
      # its base, it is judged by its own copy of the checks: a fix to the
      # checks that landed on the line cannot reach the base before the release
      # merges, and the base's older copy would re-judge commits the line has
      # already published. A fork, a feature branch, and a line that has not
      # merged its base all keep the base's copy.
      - name: Take the checks from the base branch
        id: checks
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          checks_ref="origin/${BASE_REF}"
          if [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ] \
              && printf '%s\n' "$HEAD_REF" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' \
              && git merge-base --is-ancestor "origin/${BASE_REF}" HEAD \
              && git cat-file -e "HEAD:scripts/review_gates.py" 2>/dev/null; then
            checks_ref="HEAD"
            echo "::notice::release line ${HEAD_REF} contains ${BASE_REF}; the checks come from the line's own copy"
          fi
          if ! git cat-file -e "${checks_ref}:scripts/review_gates.py" 2>/dev/null; then
            echo "::notice::${checks_ref} has no scripts/review_gates.py; nothing to run"
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/checks/tests"
          git show "${checks_ref}:scripts/review_gates.py" > "$RUNNER_TEMP/checks/review_gates.py"
          git show "${checks_ref}:scripts/tests/test_review_gates.py" > "$RUNNER_TEMP/checks/tests/test_review_gates.py"
          echo "present=true" >> "$GITHUB_OUTPUT"

      - name: Gate self-tests
        if: steps.checks.outputs.present == 'true'
        run: python3 -m unittest discover -s "$RUNNER_TEMP/checks/tests" -p 'test_review_gates.py' -v

      - name: Run the review gates
        if: steps.checks.outputs.present == 'true'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 "$RUNNER_TEMP/checks/review_gates.py" --repo . --base "origin/${BASE_REF}" --head HEAD
