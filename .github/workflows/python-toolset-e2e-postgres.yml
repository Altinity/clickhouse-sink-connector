name: Python toolset - PostgreSQL end-to-end

# Runs the sink-connector/python PostgreSQL tools (ch-pg-dump, ch-checksum,
# ch-pg-checksum, ch-pg-count, auto_diff) against a real PostgreSQL and
# ClickHouse started from sink-connector-lightweight/docker/docker-compose-postgres.yml.

on:
  workflow_call:
    inputs:
      SINK_CONNECTOR_IMAGE:
        description: "Lightweight connector docker image"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      SINK_CONNECTOR_IMAGE:
        description: "Lightweight connector docker image"
        required: true
        type: string

env:
  SINK_CONNECTOR_IMAGE: ${{ inputs.SINK_CONNECTOR_IMAGE }}
  CLICKHOUSE_SINK_CONNECTOR_LT_IMAGE: ${{ inputs.SINK_CONNECTOR_IMAGE }}
  # Keep the compose stack up after pytest so we can capture logs; we tear it down
  # explicitly in a final step.
  KEEP_STACK: "1"

jobs:
  python-toolset-e2e-postgres:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # For PRs from forks the image is not pushed to the registry, but the build
      # workflow uploads it as a tar artifact. Load it so docker compose can use it.
      - uses: actions/download-artifact@v4
        if: ${{ github.event.pull_request.head.repo.full_name != 'Altinity/clickhouse-sink-connector' && github.event_name != 'workflow_dispatch' }}
        with:
          name: clickhouse-sink-connector_${{ github.event.number }}-${{ github.sha }}-lt.tar.gz

      - name: Load Docker image
        if: ${{ github.event.pull_request.head.repo.full_name != 'Altinity/clickhouse-sink-connector' && github.event_name != 'workflow_dispatch' }}
        run: |
          docker load < clickhouse-sink-connector_${{ github.event.number }}-${{ github.sha }}-lt.tar.gz
          docker image ls

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies and the toolset
        run: |
          pip3 install -r sink-connector/python/tests_e2e/postgres/requirements.txt
          pip3 install -e sink-connector/python

      # ch-pg-dump pipes psql into clickhouse-client. psql comes with the runner
      # image; clickhouse-client is taken from the same ClickHouse image the
      # compose stack runs, so client and server versions match.
      - name: Provide psql and clickhouse-client
        run: |
          psql --version
          CH_IMAGE=$(python3 -c "import yaml; print(yaml.safe_load(open('sink-connector-lightweight/docker/clickhouse-service.yml'))['services']['clickhouse']['image'])")
          echo "ClickHouse image: ${CH_IMAGE}"
          docker pull "${CH_IMAGE}"
          cid=$(docker create "${CH_IMAGE}")
          # DESTRUCTIVE: only removes the never-started helper container created
          # on the line above (by its id) after the binary is copied out.
          mkdir -p "${RUNNER_TEMP}/ch-bin"
          docker cp "${cid}:/usr/bin/clickhouse" "${RUNNER_TEMP}/ch-bin/clickhouse"
          docker rm "${cid}"
          ln -s clickhouse "${RUNNER_TEMP}/ch-bin/clickhouse-client"
          echo "${RUNNER_TEMP}/ch-bin" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/ch-bin/clickhouse-client" --version

      - name: Run PostgreSQL toolset end-to-end tests
        run: pytest -v -rA sink-connector/python/tests_e2e/postgres

      - name: Dump compose logs on failure
        if: failure()
        working-directory: sink-connector-lightweight/docker
        run: docker compose -f docker-compose-postgres.yml logs --no-color > compose-logs-python-e2e-postgres.txt 2>&1 || true

      - name: Upload compose logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: python-toolset-e2e-postgres-compose-logs
          path: sink-connector-lightweight/docker/compose-logs-python-e2e-postgres.txt
          if-no-files-found: ignore

      - name: Tear down compose stack
        if: always()
        working-directory: sink-connector-lightweight/docker
        run: docker compose -f docker-compose-postgres.yml down -v --remove-orphans || true
