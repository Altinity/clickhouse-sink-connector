name: Kafka - Java Tests

on:
  workflow_call:
    inputs:
      SINK_CONNECTOR_IMAGE:
        description: "Kafka connector docker image"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      SINK_CONNECTOR_IMAGE:
        description: "Kafka connector docker image"
        required: true
        type: string

env:
  SINK_CONNECTOR_IMAGE: ${{ inputs.SINK_CONNECTOR_IMAGE }}
        
jobs:
  java-kafka:
    runs-on: [ self-hosted, on-demand, type-cpx51, image-x86-app-docker-ce ]
    steps:
    - uses: actions/checkout@v2
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Install maven
      run: sudo apt-get update && sudo apt-get install -y maven
    - name: Build with Maven
      working-directory: sink-connector
      run: mvn -B package -DskipTests=true --file pom.xml
    - name: Run Unit tests
      working-directory: sink-connector
      run: mvn test --file pom.xml
