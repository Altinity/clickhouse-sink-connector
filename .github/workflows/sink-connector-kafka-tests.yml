name: Kafka - Java Tests

on:
  workflow_call:
    inputs:
      SINK_CONNECTOR_IMAGE:
        description: "Kafka connector docker image"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      SINK_CONNECTOR_IMAGE:
        description: "Kafka connector docker image"
        required: true
        type: string

env:
  SINK_CONNECTOR_IMAGE: ${{ inputs.SINK_CONNECTOR_IMAGE }}
        
jobs:
  java-kafka:
    runs-on: [ self-hosted, on-demand, type-cx53-cpx52, image-x86-app-docker-ce ]
    steps:
    - uses: actions/checkout@v2
    # setup-java resolves "17" through the distribution's metadata API on
    # every run (empty tool cache on a fresh runner) and, at this pin, does
    # not retry that request. One dropped TLS handshake there fails the job
    # before any Java runs. Retry the step itself: the first attempt tolerates
    # failure, the identical second attempt runs only if the first did not
    # succeed, and a genuine failure still fails the job on that second try.
    # (`outcome` is the step result before continue-on-error is applied.)
    - name: Set up JDK 17
      id: setup-jdk
      uses: actions/setup-java@v3
      continue-on-error: true
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Set up JDK 17 (retry)
      if: steps.setup-jdk.outcome == 'failure'
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Install maven 3.8.8
      run: |
        wget https://archive.apache.org/dist/maven/maven-3/3.8.8/binaries/apache-maven-3.8.8-bin.tar.gz
        tar xzf apache-maven-3.8.8-bin.tar.gz
        sudo mv apache-maven-3.8.8 /opt/maven
        sudo ln -sf /opt/maven/bin/mvn /usr/bin/mvn
        mvn --version
    - name: Build with Maven
      working-directory: sink-connector
      run: mvn -B package -DskipTests=true --file pom.xml
    - name: Run Unit tests
      working-directory: sink-connector
      run: mvn test --file pom.xml
